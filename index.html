<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareVo - AI-Powered Restaurant OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="variables.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary:     'var(--color-primary)',
              secondary:   'var(--color-secondary)',
              surface:     'var(--color-surface)',
              background:  'var(--color-bg)',
              'text-main': 'var(--color-text)',
              'text-soft': 'var(--color-text-soft)',
              success:     'var(--color-success)',
              warning:     'var(--color-warning)',
              error:       'var(--color-error)',
              border:      'var(--color-border)',
              placeholder: 'var(--color-placeholder)',
              disabled:    'var(--color-disabled-bg)',
              overlay:     'var(--color-overlay)',
            },
            fontFamily: {
              sans: 'var(--font-family)',
            },
            fontSize: {
              hero: ['var(--fs-hero)', { lineHeight: 'var(--lh-hero)' }],
            },
            fontWeight: {
              black: 'var(--fw-display)',
            },
            borderRadius: {
              btn:   'var(--radius-btn)',
              card:  'var(--radius-card)',
              modal: 'var(--radius-modal)',
            },
            boxShadow: {
              card:  'var(--shadow-card)',
              hover: 'var(--shadow-hover)',
            },
          },
        },
      }
    </script>
    <style>
        body {
            font-family: var(--font-family);
            background-color: var(--color-bg);
            color: var(--color-text);
        }

        .dot-grid {
            background-image: radial-gradient(#f2f4f7 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .nothing-border {
            border: 1px solid var(--color-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nothing-border:hover {
            border-color: var(--color-secondary);
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>

<body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
